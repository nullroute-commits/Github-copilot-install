---
all:
  children:
    proxmox_nodes:
      hosts:
        # Example Proxmox 9 node - replace with your actual node details
        proxmox-node-01:
          ansible_host: 192.168.1.100
          ansible_user: root
          ansible_connection: ssh

        # Add more Proxmox nodes as needed
        # proxmox-node-02:
        #   ansible_host: 192.168.1.101
        #   ansible_user: root
        #   ansible_connection: ssh

      vars:
        # Common variables for all Proxmox nodes
        ansible_python_interpreter: /usr/bin/python3
        # WARNING: Never disable SSH host key checking in production environments.
        # Disabling StrictHostKeyChecking exposes you to man-in-the-middle attacks.
        # Instead, ensure all Proxmox node SSH host keys are present and correct in your Ansible control node's ~/.ssh/known_hosts file.
        # See https://docs.ansible.com/ansible/latest/user_guide/intro_ssh.html#host-key-checking for secure configuration guidance.
        # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

        # GitHub Copilot CLI installation variables
        nodejs_version: "22"
        npm_version: "10"
        copilot_cli_package: "@github/copilot"

        # Environment settings
        environment_name: proxmox
        install_verification_enabled: true
